name: DVP Safe - Windows x64

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dvp-safe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout YOUR fork
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout upstream network dependency
        uses: actions/checkout@v4
        with:
          repository: runetfreedom/force-proxy
          ref: master
          path: _deps/force-proxy
          persist-credentials: false

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Configure patched project and force-proxy
        shell: pwsh
        run: |
          python tools/prepare_project.py
          if ($LASTEXITCODE -ne 0) { throw 'Loader project patch failed' }
          python tools/patch_force_proxy.py _deps/force-proxy
          if ($LASTEXITCODE -ne 0) { throw 'Network source patch failed' }

      - name: Install Microsoft Detours with vcpkg
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg bootstrap failed' }
          & "$env:RUNNER_TEMP\vcpkg\vcpkg.exe" install detours:x64-windows --classic
          if ($LASTEXITCODE -ne 0) { throw 'Detours install failed' }
          & "$env:RUNNER_TEMP\vcpkg\vcpkg.exe" integrate install
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg integration failed' }

      - name: Compile patched force-proxy
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'build/network/'
          New-Item -ItemType Directory -Force $out | Out-Null
          msbuild _deps/force-proxy/force-proxy.sln /t:Build /m /p:Configuration=Release /p:Platform=x64 /p:VcpkgEnableManifest=false "/p:OutDir=$out"
          if ($LASTEXITCODE -ne 0) { throw 'Network DLL build failed' }
          if (!(Test-Path (Join-Path $out 'force-proxy.dll'))) { throw 'Missing force-proxy.dll' }

      - name: Compile loader from YOUR fork
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'build/loader/'
          New-Item -ItemType Directory -Force $out | Out-Null
          msbuild proxy-dll/discord-voice-proxy.vcxproj /t:Build /m /p:Configuration=Release /p:Platform=x64 /p:VcpkgEnableManifest=false "/p:OutDir=$out"
          if ($LASTEXITCODE -ne 0) { throw 'Loader DLL build failed' }
          if (!(Test-Path (Join-Path $out 'DWrite.dll'))) { throw 'Missing DWrite.dll' }

      - name: Verify PE x64 exports
        shell: pwsh
        run: |
          python tools/verify_pe.py build/loader/DWrite.dll DWriteCreateFactory
          if ($LASTEXITCODE -ne 0) { throw 'DWrite.dll validation failed' }
          python tools/verify_pe.py build/network/force-proxy.dll StartForceProxy
          if ($LASTEXITCODE -ne 0) { throw 'force-proxy.dll validation failed' }

      - name: Package sources and Windows DLLs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/package | Out-Null
          python tools/package_sources.py _deps/force-proxy dist/package/DVP-Safe-Source.zip
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          Copy-Item 'build/loader/DWrite.dll' 'dist/package/DWrite.dll'
          Copy-Item 'build/network/force-proxy.dll' 'dist/package/force-proxy-safe.dll'
          Copy-Item 'tools/Install-DVPSafe.ps1' 'dist/package/Install-DVPSafe.ps1'
          Copy-Item 'tools/Disable-DVPSafe.ps1' 'dist/package/Disable-DVPSafe.ps1'
          Copy-Item 'docs/DVP-SAFE.md' 'dist/package/README.ru.md'
          Copy-Item 'LICENSE.txt' 'dist/package/LICENSE.txt'
          Compress-Archive -Path 'dist/package/*' -DestinationPath 'dist/DVP-Safe-Windows-x64.zip' -Force

      - name: Upload downloadable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: DVP-Safe-Windows-x64
          path: dist/DVP-Safe-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
